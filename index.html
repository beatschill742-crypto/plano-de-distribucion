<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plano de Distribución - Bodas de Oro</title>
    
    <!-- Librerías de diseño, tipografías y PDF -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --vino: #600000;
            --dorado: #d4af37;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f7f3f0;
            color: #1a1a1a;
        }
        .font-serif-elegant { font-family: 'Cinzel', serif; }
        
        .mesa-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid var(--dorado);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin: 0 auto 15px auto;
            position: relative;
        }
        
        /* Simular sillas (cuadritos) alrededor de la mesa */
        .silla {
            position: absolute;
            width: 14px;
            height: 8px;
            background-color: #4a7ebb; /* Azul de tu imagen */
            border-radius: 2px;
        }

        .guest-list {
            font-size: 0.75rem;
            line-height: 1.4;
            color: #4b5563;
        }
        
        .guest-list li {
            border-bottom: 1px dashed #e5e7eb;
            padding-bottom: 2px;
            margin-bottom: 2px;
        }
        .guest-list li:last-child { border-bottom: none; }

        @media print {
            .no-print { display: none !important; }
            body { background-color: white; }
            #plano-export { padding: 0 !important; }
            .page-break { page-break-inside: avoid; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Botón de Descarga PDF -->
    <div class="max-w-7xl mx-auto mb-8 text-center no-print flex flex-col md:flex-row justify-center items-center gap-4">
        <button onclick="downloadPDF()" class="bg-[#600000] text-white px-8 py-3 rounded-full font-bold uppercase tracking-wider hover:bg-[#800000] transition-colors shadow-lg flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            Descargar PDF para el Salón
        </button>
        <a href="index.html" class="text-[#600000] underline font-medium text-sm">Volver a Pases de Acceso</a>
    </div>

    <!-- Contenedor del Plano que se convertirá en PDF -->
    <div id="plano-export" class="max-w-7xl mx-auto bg-white p-8 md:p-12 rounded-xl shadow-2xl border border-gray-200">
        
        <div class="text-center mb-12 border-b-2 border-[#d4af37] pb-8">
            <h3 class="font-serif-elegant text-lg uppercase tracking-[0.4em] text-[#b38728] font-bold mb-2">Centro de Convenciones Lapislázuli Coronado</h3>
            <h1 class="font-serif-elegant text-4xl md:text-5xl text-[#600000] font-bold mb-4">Plano de Distribución</h1>
            <p class="text-gray-500 uppercase tracking-widest font-medium">Bodas de Oro Fede & Jovita • 27 Mesas Confirmadas</p>
            
            <div class="mt-8 inline-block bg-gray-100 px-6 py-2 rounded-lg font-bold text-gray-700 uppercase tracking-widest text-sm border border-gray-300">
                Pista de Baile / Grupo Honor
            </div>
        </div>

        <!-- Contenedor general del Plano -->
        <div class="relative w-full max-w-5xl mx-auto h-[800px] border-2 border-gray-400 bg-white" style="font-family: Arial, sans-serif;">
            
            <!-- Grupo y Pista Central -->
            <div class="absolute top-[2%] left-[40%] w-[20%] h-[8%] border border-black flex items-center justify-center font-bold text-sm bg-white z-10" style="clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);">
                GRUPO
            </div>
            
            <div class="absolute top-[10%] left-[38%] w-[24%] h-[60%] border border-black flex items-center justify-center font-bold text-2xl bg-white z-10">
                PISTA
            </div>
            
            <div class="absolute top-[72%] left-[45%] w-[10%] h-[5%] border border-black border-dashed flex items-center justify-center font-bold text-xs bg-white z-10">
                HONOR
            </div>

            <!-- Área vacía punteada (derecha) -->
            <div class="absolute top-[5%] right-[18%] w-[12%] h-[25%] border border-black border-dotted z-10"></div>

            <!-- Mesas lado Izquierdo de la pista -->
            <!-- Columna Izquierda (13, 14, 15) -->
            <div id="mesa-13" class="absolute top-[15%] left-[5%]"></div>
            <div id="mesa-14" class="absolute top-[35%] left-[5%]"></div>
            <div id="mesa-15" class="absolute top-[55%] left-[5%]"></div>

            <!-- Columna Centro-Izq (9, 10, 11, 12) -->
            <div id="mesa-9"  class="absolute top-[10%] left-[15%]"></div>
            <div id="mesa-10" class="absolute top-[28%] left-[15%]"></div>
            <div id="mesa-11" class="absolute top-[46%] left-[15%]"></div>
            <div id="mesa-12" class="absolute top-[64%] left-[15%]"></div>

            <!-- Columna Derecha-Izq (8, 7, 6, 5) -->
            <div id="mesa-8" class="absolute top-[10%] left-[25%]"></div>
            <div id="mesa-7" class="absolute top-[28%] left-[25%]"></div>
            <div id="mesa-6" class="absolute top-[46%] left-[25%]"></div>
            <div id="mesa-5" class="absolute top-[64%] left-[25%]"></div>
            
            <!-- Columna Pegada a Pista Izq (4, 3, 2, 1) -->
            <div id="mesa-4" class="absolute top-[10%] left-[35%]"></div>
            <div id="mesa-3" class="absolute top-[28%] left-[35%]"></div>
            <div id="mesa-2" class="absolute top-[46%] left-[35%]"></div>
            <div id="mesa-1" class="absolute top-[64%] left-[35%]"></div>


            <!-- Mesas lado Derecho de la pista -->
            <!-- Columna Pegada a Pista Der (16, 17, 18, 19) -->
            <div id="mesa-16" class="absolute top-[10%] right-[35%]"></div>
            <div id="mesa-17" class="absolute top-[28%] right-[35%]"></div>
            <div id="mesa-18" class="absolute top-[46%] right-[35%]"></div>
            <div id="mesa-19" class="absolute top-[64%] right-[35%]"></div>

            <!-- Columna Centro-Der (20, 21) -->
            <div id="mesa-20" class="absolute top-[46%] right-[25%]"></div>
            <div id="mesa-21" class="absolute top-[64%] right-[25%]"></div>

            <!-- Columna Derecha (26, 25, 24, 23, 22) -->
            <div id="mesa-26" class="absolute top-[2%] right-[5%]"></div>
            <div id="mesa-25" class="absolute top-[20%] right-[5%]"></div>
            <div id="mesa-24" class="absolute top-[38%] right-[5%]"></div>
            <div id="mesa-23" class="absolute top-[56%] right-[5%]"></div>
            <div id="mesa-22" class="absolute top-[74%] right-[5%]"></div>
            
            <!-- Agregando la Mesa 27 (debajo de la 21 para balancear o en un área libre) -->
            <div id="mesa-27" class="absolute top-[78%] right-[25%]"></div>

        </div>

    </div>

    <script>
        // Capacidad oficial por mesa según tus datos
        const capacidadMesas = {
            1: 11, 2: 10, 3: 9, 4: 10, 5: 10, 6: 11, 7: 10, 8: 10, 9: 11,
            10: 12, 11: 12, 12: 10, 13: 12, 14: 12, 15: 12, 16: 11, 17: 12,
            18: 9, 19: 11, 20: 12, 21: 11, 22: 10, 23: 10, 24: 10, 25: 10,
            26: 9, 27: 6
        };

        // Función para dibujar una mesa con sus sillas
        function dibujarMesa(numMesa) {
            const lugares = capacidadMesas[numMesa];
            const container = document.getElementById(`mesa-${numMesa}`);
            if(!container) return; // Por si la mesa no está mapeada en el HTML
            
            // Generar cuadritos simulando sillas
            let sillasHTML = '';
            const angleStep = 360 / lugares;
            for(let s = 0; s < lugares; s++) {
                const angle = s * angleStep;
                const radius = 32; // Radio de la mesa para las sillas
                const x = radius * Math.cos(angle * Math.PI / 180);
                const y = radius * Math.sin(angle * Math.PI / 180);
                const rotation = angle + 90;
                
                sillasHTML += `<div style="position: absolute; width: 8px; height: 12px; background-color: #4a7ebb; border-radius: 1px; top: calc(50% - 6px + ${y}px); left: calc(50% - 4px + ${x}px); transform: rotate(${rotation}deg);"></div>`;
            }

            container.innerHTML = `
                <div style="position: relative; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; transform: translate(-50%, -50%);">
                    ${sillasHTML}
                    <div style="width: 50px; height: 50px; border-radius: 50%; border: 3px solid #f8ab4f; background-color: white; display: flex; align-items: center; justify-content: center; z-index: 10; font-weight: bold; color: black; font-size: 16px;">
                        ${numMesa}
                    </div>
                    <div style="position: absolute; bottom: -10px; right: -15px; font-size: 12px; font-weight: bold; color: black;">
                        ${lugares}
                    </div>
                </div>
            `;
        }

        // Dibujar las 27 mesas
        for (let i = 1; i <= 27; i++) {
            dibujarMesa(i);
        }

        function downloadPDF() {
            const element = document.getElementById('plano-export');
            const opt = {
                margin:       10,
                filename:     'Plano_Mesas_BodasDeOro.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' } // Horizontal para que quepan mejor las mesas
            };

            // Notificación visual de carga
            const btn = document.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ Generando PDF...';
            btn.disabled = true;

            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
