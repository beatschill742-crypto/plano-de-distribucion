<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plano de Distribución - Bodas de Oro</title>
    
    <!-- Librerías de diseño, tipografías y PDF -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f7f3f0;
            color: #1a1a1a;
        }
        .font-serif-elegant { font-family: 'Cinzel', serif; }

        @media print {
            .no-print { display: none !important; }
            body { background-color: white; }
            #plano-export { padding: 0 !important; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Botón de Descarga PDF -->
    <div class="max-w-7xl mx-auto mb-8 text-center no-print flex flex-col md:flex-row justify-center items-center gap-4">
        <button onclick="downloadPDF()" class="bg-[#600000] text-white px-8 py-3 rounded-full font-bold uppercase tracking-wider hover:bg-[#800000] transition-colors shadow-lg flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            Descargar Plano Oficial
        </button>
        <a href="index.html" class="text-[#600000] underline font-medium text-sm">Volver a Pases de Acceso</a>
    </div>

    <!-- Contenedor del Plano -->
    <div id="plano-export" class="max-w-7xl mx-auto bg-white p-8 md:p-12 rounded-xl shadow-2xl border border-gray-200 overflow-x-auto">
        
        <div class="text-center mb-8 border-b-2 border-[#d4af37] pb-6 min-w-[900px]">
            <h3 class="font-serif-elegant text-lg uppercase tracking-[0.4em] text-[#b38728] font-bold mb-2">Centro de Convenciones Lapislázuli Coronado</h3>
            <h1 class="font-serif-elegant text-4xl md:text-5xl text-[#600000] font-bold mb-2">Plano de Acomodo Oficial</h1>
            <p class="text-gray-500 uppercase tracking-widest font-medium">Bodas de Oro Fede & Jovita • 31 de Mayo 2026</p>
        </div>

        <!-- Lienzo del Salón (Escala fija para asegurar proporciones perfectas) -->
        <div class="relative w-[1000px] h-[650px] mx-auto border-2 border-gray-400 bg-white" style="font-family: Arial, sans-serif;">
            
            <!-- Grupo -->
            <div class="absolute top-[2%] left-[40%] w-[20%] h-[8%] border-2 border-black flex items-center justify-center font-bold text-sm bg-white z-10" style="clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);">
                GRUPO
            </div>
            
            <!-- Bocinas (cuadritos azules junto al grupo) -->
            <div class="absolute top-[8%] left-[37%] w-[3%] h-[3%] border-2 border-blue-800 bg-white z-10"></div>
            <div class="absolute top-[8%] right-[37%] w-[3%] h-[3%] border-2 border-blue-800 bg-white z-10"></div>

            <!-- Pista -->
            <div class="absolute top-[10%] left-[35%] w-[30%] h-[70%] border-2 border-black flex items-center justify-center font-bold text-3xl tracking-widest bg-white z-10">
                PISTA
            </div>
            
            <!-- Mesa Honor -->
            <div class="absolute top-[85%] left-[44%] w-[12%] h-[6%] border-2 border-black border-dashed flex flex-col items-center justify-center font-bold text-sm bg-white z-10">
                HONOR
            </div>

            <!-- Área de Servicio (rectángulo punteado a la derecha) -->
            <div class="absolute top-[20%] right-[15%] w-[8%] h-[25%] border border-black border-dashed flex items-center justify-center text-gray-400">
                <span class="transform rotate-45 text-2xl">↘</span>
            </div>


            <!-- ============================================== -->
            <!-- MÓDULOS PARA MESAS (CONTENEDORES VACÍOS)     -->
            <!-- ============================================== -->

            <!-- LADO IZQUIERDO -->
            <!-- Col 1: Pegada a pista -->
            <div id="mesa-4" class="absolute top-[10%] left-[26%]"></div>
            <div id="mesa-3" class="absolute top-[30%] left-[26%]"></div>
            <div id="mesa-2" class="absolute top-[50%] left-[26%]"></div>
            <div id="mesa-1" class="absolute top-[70%] left-[26%]"></div>

            <!-- Col 2: -->
            <div id="mesa-8" class="absolute top-[10%] left-[18%]"></div>
            <div id="mesa-7" class="absolute top-[30%] left-[18%]"></div>
            <div id="mesa-6" class="absolute top-[50%] left-[18%]"></div>
            <div id="mesa-5" class="absolute top-[70%] left-[18%]"></div>

            <!-- Col 3: -->
            <div id="mesa-9"  class="absolute top-[10%] left-[10%]"></div>
            <div id="mesa-10" class="absolute top-[30%] left-[10%]"></div>
            <div id="mesa-11" class="absolute top-[50%] left-[10%]"></div>
            <div id="mesa-12" class="absolute top-[70%] left-[10%]"></div>

            <!-- Col 4: Orilla Izquierda Desfasada -->
            <div id="mesa-13" class="absolute top-[20%] left-[2%]"></div>
            <div id="mesa-14" class="absolute top-[40%] left-[2%]"></div>
            <div id="mesa-15" class="absolute top-[60%] left-[2%]"></div>


            <!-- LADO DERECHO -->
            <!-- Col 1: Pegada a pista -->
            <div id="mesa-16" class="absolute top-[15%] right-[26%]"></div>
            <div id="mesa-17" class="absolute top-[35%] right-[26%]"></div>
            <div id="mesa-18" class="absolute top-[55%] right-[26%]"></div>
            <div id="mesa-19" class="absolute top-[75%] right-[26%]"></div>

            <!-- Col 2: Debajo del área de servicio -->
            <!-- Mesa 27 agregada al lado de la 26 -->
            <div id="mesa-27" class="absolute top-[5%] right-[17%]"></div>
            <div id="mesa-20" class="absolute top-[50%] right-[17%]"></div>
            <div id="mesa-21" class="absolute top-[70%] right-[17%]"></div>

            <!-- Col 3: Orilla Derecha -->
            <div id="mesa-26" class="absolute top-[5%] right-[5%]"></div>
            <div id="mesa-25" class="absolute top-[25%] right-[5%]"></div>
            <div id="mesa-24" class="absolute top-[45%] right-[5%]"></div>
            <div id="mesa-23" class="absolute top-[65%] right-[5%]"></div>
            <div id="mesa-22" class="absolute top-[85%] right-[5%]"></div>

        </div>
    </div>

    <script>
        // Capacidad oficial por mesa según tu tabla final
        const capacidadMesas = {
            1: 11, 2: 10, 3: 9, 4: 10, 5: 10, 6: 11, 7: 10, 8: 10, 9: 11,
            10: 12, 11: 12, 12: 10, 13: 12, 14: 12, 15: 12, 16: 11, 17: 12,
            18: 9, 19: 11, 20: 12, 21: 11, 22: 10, 23: 10, 24: 10, 25: 10,
            26: 9, 27: 6
        };

        // Función para dibujar una mesa con sus sillas
        function dibujarMesa(numMesa) {
            const lugares = capacidadMesas[numMesa];
            const container = document.getElementById(`mesa-${numMesa}`);
            if(!container) return; 
            
            // Generar cuadritos simulando sillas alrededor
            let sillasHTML = '';
            const angleStep = 360 / lugares;
            for(let s = 0; s < lugares; s++) {
                const angle = s * angleStep;
                const radius = 35; // Radio exterior para las sillas
                const x = radius * Math.cos(angle * Math.PI / 180);
                const y = radius * Math.sin(angle * Math.PI / 180);
                const rotation = angle + 90;
                
                sillasHTML += `<div style="position: absolute; width: 10px; height: 16px; background-color: #4a7ebb; border-radius: 2px; top: calc(50% - 8px + ${y}px); left: calc(50% - 5px + ${x}px); transform: rotate(${rotation}deg);"></div>`;
            }

            container.innerHTML = `
                <div style="position: relative; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; transform: translate(-50%, -50%);">
                    ${sillasHTML}
                    <!-- Círculo central de la mesa -->
                    <div style="width: 55px; height: 55px; border-radius: 50%; border: 3px solid #f8ab4f; background-color: white; display: flex; align-items: center; justify-content: center; z-index: 10; font-family: Arial; font-weight: normal; color: black; font-size: 16px;">
                        ${numMesa}
                    </div>
                    <!-- Número chiquito indicador de sillas -->
                    <div style="position: absolute; bottom: 5px; right: 5px; font-size: 14px; font-weight: bold; font-family: Arial; color: black; background: white; padding: 0 4px; border-radius: 4px;">
                        ${lugares}
                    </div>
                </div>
            `;
        }

        // Dibujar las 27 mesas al cargar
        for (let i = 1; i <= 27; i++) {
            dibujarMesa(i);
        }

        function downloadPDF() {
            const element = document.getElementById('plano-export');
            const opt = {
                margin:       [10, 10, 10, 10], // top, left, bottom, right
                filename:     'Plano_Acomodo_BodasDeOro.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'legal', orientation: 'landscape' } // Tamaño oficio/legal para que abarque a lo ancho
            };

            const btn = document.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ Generando PDF...';
            btn.disabled = true;

            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
